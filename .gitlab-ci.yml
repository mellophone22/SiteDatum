stages:
  - test
  - secret-detection

default:
  interruptible: true

variables:
  SECRET_DETECTION_ENABLED: 'true'

frontend_quality:
  stage: test
  image: node:24-bookworm
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  variables:
    npm_config_cache: "$CI_PROJECT_DIR/.npm"
  script:
    - test ! -e "assets/templates/Blank RFI.xls"
    - test ! -e "src-tauri/resources/templates/blank-rfi-template.pdf"
    - npm ci --prefer-offline --no-audit
    - npm audit --audit-level=high
    - npm run lint
    - npm test -- --run
    - npm run test:release-manifest
    - npm run test:site
    - npm run build

rust_quality:
  stage: test
  image: rust:1.97-bookworm
  cache:
    key:
      prefix: rust-1.97-cargo-audit-0.22.2
      files:
        - src-tauri/Cargo.lock
    paths:
      - .cargo/bin/cargo-audit
      - .cargo/git/
      - .cargo/registry/
      - src-tauri/target/
  variables:
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
  before_script:
    - rustup component add rustfmt
    - apt-get update
    - apt-get install --yes --no-install-recommends libwebkit2gtk-4.1-dev libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
    - test -x "$CARGO_HOME/bin/cargo-audit" || cargo install cargo-audit --version 0.22.2 --locked
  script:
    - cd src-tauri
    - cargo audit --file Cargo.lock
    - cargo fmt --all -- --check
    - cargo test --locked

supabase_database:
  stage: test
  image: node:24-bookworm
  tags:
    - saas-linux-small-amd64
  services:
    - name: docker:24.0.5-dind
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends docker.io
    - docker info
    - npm ci --prefer-offline --no-audit
  script:
    - npx supabase db start
    - npm run test:licensing-db
  after_script:
    - npx supabase stop --no-backup || true

sync_v2_proof:
  stage: test
  image: node:24-bookworm
  tags:
    - saas-linux-small-amd64
  services:
    - name: docker:24.0.5-dind
  variables:
    DOCKER_HOST: "tcp://docker:2376"
    DOCKER_TLS_CERTDIR: "/certs"
    DOCKER_CERT_PATH: "/certs/client"
    DOCKER_TLS_VERIFY: "1"
  before_script:
    - apt-get update
    - apt-get install --yes --no-install-recommends docker.io
    - docker info
    - npm ci --prefer-offline --no-audit
  script:
    - cd proofs/sync-v2-identity
    - npx supabase start
    - npx supabase test db --local
    - npx supabase db lint --local --schema public --schema sync_v2_private
    - set -a
    - eval "$(npx supabase status -o env)"
    - set +a
    - export SYNC_TEST_API_URL="$API_URL"
    - export SYNC_TEST_PUBLISHABLE_KEY="$PUBLISHABLE_KEY"
    - export SYNC_TEST_SECRET_KEY="$SECRET_KEY"
    - node supabase/tests/trusted_enrollment_bridge.integration.mjs
    - node supabase/tests/authenticated_device_transfer.integration.mjs
    - node supabase/tests/encrypted_record_operations.integration.mjs
  after_script:
    - npx supabase stop --no-backup --workdir proofs/sync-v2-identity || true

secret_detection:
  stage: secret-detection

include:
  - template: Security/Secret-Detection.gitlab-ci.yml
