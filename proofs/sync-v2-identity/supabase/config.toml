project_id = "sitedatum-sync-v2-identity-proof"

[api]
enabled = true
port = 56321
schemas = ["public", "sync_v2_proof"]
extra_search_path = ["public", "extensions"]
max_rows = 100
auto_expose_new_tables = false

[db]
port = 56322
shadow_port = 56320
major_version = 17

[db.migrations]
enabled = true

[db.seed]
enabled = false

[realtime]
enabled = false

[studio]
enabled = false

[local_smtp]
enabled = false

[storage]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:56300"
additional_redirect_urls = ["http://127.0.0.1:*/callback"]
jwt_expiry = 300
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = false
minimum_password_length = 12

[auth.email]
enable_signup = true
enable_confirmations = true

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[auth.hook.custom_access_token]
enabled = true
uri = "pg-functions://postgres/sync_v2_private/custom_access_token_hook"

[edge_runtime]
enabled = false

[analytics]
enabled = false
