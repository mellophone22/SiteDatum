[package]
name = "project_engineer_workspace"
version = "1.4.4"
description = "SiteDatum local-first Windows project engineering workspace"
authors = ["SiteDatum"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "project_engineer_workspace_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = []
# Production commerce builds deliberately fail at compile time unless the public
# production licensing coordinates are supplied by the release environment.
commercial-production = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled", "backup"] }
uuid = { version = "1", features = ["v4"] }
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
lopdf = { version = "0.45", default-features = false }
encoding_rs = "0.8"
csv = "1.4.0"
calamine = "0.36.1"
rust_xlsxwriter = "0.99.1"
tauri-plugin-notification = "2.4.0"
tauri-plugin-opener = "2.7.0"
base64 = "0.22"
ed25519-dalek = "2"
sha2 = "0.10"
getrandom = "0.3.4"
zeroize = "1.8.2"
hpke = { version = "0.14.1", default-features = false, features = ["alloc", "getrandom", "x25519", "chacha"] }
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
hkdf = "0.12.4"

[dev-dependencies]


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
