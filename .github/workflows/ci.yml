name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Reject retired bundled RFI templates
        shell: bash
        run: |
          test ! -e "assets/templates/Blank RFI.xls"
          test ! -e "src-tauri/resources/templates/blank-rfi-template.pdf"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Test release provenance
        run: npm run test:release-manifest
      - name: Validate commercial site
        run: npm run test:site
      - name: Build frontend
        run: npm run build

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Set up Rust 1.97
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup default 1.97.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --locked

  windows-native:
    name: Windows native and staged provenance
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Set up Rust 1.97
        shell: pwsh
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup default 1.97.0
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Test release provenance
        run: npm run test:release-manifest
      - name: Run native Windows tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - name: Build frontend
        run: npm run build
      - name: Confirm clean source before packaging
        shell: pwsh
        run: |
          git diff --exit-code
          git diff --cached --exit-code
          $untracked = @(git ls-files --others --exclude-standard)
          if ($untracked.Count -ne 0) {
            throw "Unexpected untracked source before packaging: $($untracked -join ', ')"
          }
      - name: Build CI-only unsigned NSIS package
        run: npm run tauri -- build --bundles nsis
      - name: Smoke-test release executable
        shell: pwsh
        run: |
          $executable = (Resolve-Path -LiteralPath 'src-tauri\target\release\SiteDatum.exe').Path
          $process = Start-Process -FilePath $executable -WindowStyle Hidden -PassThru
          try {
            Start-Sleep -Seconds 5
            if ($process.HasExited) {
              throw "SiteDatum exited during the startup smoke with code $($process.ExitCode)."
            }
          } finally {
            if (-not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }
      - name: Generate and verify staged provenance
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath 'package.json' -Raw | ConvertFrom-Json).version
          $installerName = "SiteDatum_${version}_x64-setup.exe"
          $installer = (Resolve-Path -LiteralPath "src-tauri/target/release/bundle/nsis/$installerName").Path
          $verificationRoot = Join-Path $env:RUNNER_TEMP "sitedatum-provenance-$env:GITHUB_RUN_ID"

          git worktree add --detach $verificationRoot $env:GITHUB_SHA
          $verificationTemp = Join-Path $verificationRoot 'tmp'
          New-Item -ItemType Directory -Force -Path $verificationTemp | Out-Null
          Copy-Item -LiteralPath $installer -Destination (Join-Path $verificationTemp $installerName)

          Push-Location $verificationRoot
          try {
            node scripts/generate-release-manifest.mjs --source-commit $env:GITHUB_SHA --installer "tmp/$installerName" --expect-signature NotSigned --output tmp/windows-ci-manifest.json
            node scripts/verify-release-manifest.mjs --manifest tmp/windows-ci-manifest.json --installer "tmp/$installerName" --source-commit $env:GITHUB_SHA --evidence-commit $env:GITHUB_SHA --expect-signature NotSigned
          } finally {
            Pop-Location
          }

          New-Item -ItemType Directory -Force -Path 'tmp' | Out-Null
          Copy-Item -LiteralPath (Join-Path $verificationTemp 'windows-ci-manifest.json') -Destination 'tmp/windows-ci-manifest.json'
      - name: Confirm CI artifact remains unpublished
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath 'tmp\windows-ci-manifest.json' -Raw | ConvertFrom-Json
          if ($manifest.state -ne 'staged' -or $null -ne $manifest.publication.downloadUrl -or $null -ne $manifest.publication.date) {
            throw 'Windows CI may create only an unpublished staged manifest.'
          }

  licensing-database:
    name: Licensing database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Start disposable Supabase stack
        run: npm run supabase:start
      - name: Run licensing and Stripe adapter tests
        run: npm run test:licensing-db
      - name: Stop disposable Supabase stack
        if: always()
        run: npm run supabase:stop
