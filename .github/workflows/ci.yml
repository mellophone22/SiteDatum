name: CI

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Reject retired bundled RFI templates
        shell: bash
        run: |
          test ! -e "assets/templates/Blank RFI.xls"
          test ! -e "src-tauri/resources/templates/blank-rfi-template.pdf"
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Audit production dependencies
        run: npm audit --audit-level=high
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test -- --run
      - name: Validate commercial site
        run: npm run test:site
      - name: Build frontend
        run: npm run build

  rust:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install Tauri Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - name: Set up Rust 1.97
        run: |
          rustup toolchain install 1.97.0 --profile minimal --component rustfmt
          rustup default 1.97.0
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Rust dependencies
        run: cargo audit --file Cargo.lock
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Rust tests
        run: cargo test --locked

  licensing-database:
    name: Licensing database
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit
      - name: Start disposable Supabase stack
        run: npm run supabase:start
      - name: Run licensing and Stripe adapter tests
        run: npm run test:licensing-db
      - name: Stop disposable Supabase stack
        if: always()
        run: npm run supabase:stop
